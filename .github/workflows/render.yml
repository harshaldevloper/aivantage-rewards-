name: Render clips

# Runs the reel studio on a cloud runner instead of your machine, publishes the
# MP4s as release assets (free, public URLs -- Instagram's Graph API needs a
# fetchable URL later), then sends the batch to Telegram for approval.
on:
  workflow_dispatch:
    inputs:
      reels:
        description: "Space-separated reel configs, e.g. 01-clips 04-edit"
        required: true
      campaign:
        description: "Campaign label shown on the Telegram card"
        default: "aivantage"
      cpm:
        description: "CPM for that campaign, e.g. 10.00"
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        # Hindi captions need a Devanagari-capable font on the runner. Without
        # one Chromium draws tofu boxes (▯▯▯) while the voiceover still sounds
        # perfect, so the failure is invisible until you watch the MP4.
        #
        # The face lives in fonts-noto-core (there is no fonts-noto-devanagari
        # package -- asking for one fails the job with "Unable to locate").
        # fonts-indic is a belt-and-braces metapackage for Indic scripts.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-indic

          # Verify rather than assume: fontconfig knows what actually resolves
          # for Hindi. Failing here is far cheaper than finding out in the MP4.
          if ! fc-list :lang=hi | grep -q .; then
            echo "::error::No Devanagari-capable font on the runner. Hindi reels would render as ▯▯▯ boxes."
            exit 1
          fi
          echo "Devanagari fonts available:"
          fc-list :lang=hi family | sort -u | head -12

      - name: Install edge-tts
        run: pip install --quiet edge-tts

      - name: Install node deps
        working-directory: studio
        # No lockfile is committed (node_modules is gitignored), so `npm i`
        # rather than `npm ci`. This also pulls Puppeteer's Chromium.
        run: npm install --no-audit --no-fund

      - name: Validate configs before spending runner time
        # A bad palette or a missing scene file fails several minutes into the
        # render, after Chromium has downloaded. This catches that class in a
        # second, and fails the job before anything expensive starts.
        working-directory: studio
        run: python3 validate-reels.py ${{ inputs.reels }}

      - name: Render
        working-directory: studio
        env:
          PYTHON_BIN: python3
        run: |
          set -euo pipefail
          for name in ${{ inputs.reels }}; do
            echo "::group::rendering $name"
            node make-reel.js "reels/$name.json"
            echo "::endgroup::"
          done
          ls -la out/

      - name: Publish MP4s as release assets
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="clips-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" --title "$TAG" --notes "Automated clip batch"
          for f in studio/out/*.mp4; do
            gh release upload "$TAG" "$f"
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build review manifest
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.upload.outputs.tag }}
          CAMPAIGN: ${{ inputs.campaign }}
          CPM: ${{ inputs.cpm }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          clips = []
          for mp4 in sorted(pathlib.Path("studio/out").glob("*.mp4")):
              stem = mp4.stem
              cfg = pathlib.Path(f"studio/reels/{stem.replace('reel-','')}.json")
              caption = ""
              if cfg.exists():
                  data = json.loads(cfg.read_text(encoding="utf-8"))
                  caption = data.get("script", "")[:200]
              clips.append({
                  "id": f"{tag}-{stem}",
                  # Both, deliberately: `file` is what Telegram uploads (its URL
                  # fetcher fails on GitHub's signed redirect), `url` is the
                  # public address publish.py hands to the Instagram Graph API.
                  "file": str(mp4),
                  "url": f"{base}/{mp4.name}",
                  "campaign": os.environ.get("CAMPAIGN") or "aivantage",
                  "caption": caption,
                  "cpm": os.environ.get("CPM") or None,
                  "min_views": 1000,
              })
          pathlib.Path("out").mkdir(exist_ok=True)
          pathlib.Path("out/manifest.json").write_text(
              json.dumps(clips, indent=1), encoding="utf-8")
          print(f"manifest: {len(clips)} clip(s)")
          PY

      - name: Send batch to Telegram for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python approve.py send --manifest out/manifest.json

      - name: Persist queue
        # always(): clips already delivered to Telegram are recorded one by one,
        # and an unrecorded one can never be approved. A failure halfway through
        # the batch must not throw away the ones that made it.
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: queue clips for review"
            git pull --rebase --autostash
            git push
          fi

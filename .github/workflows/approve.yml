name: Collect approvals

# Actions is cron-driven, not a long-running server, so instead of a Telegram
# webhook (which would need hosting) we drain getUpdates on a schedule. Verdicts
# are committed back to the repo -- that commit is the whole database.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two overlapping runs would both read the same getUpdates offset and one
  # would lose its taps.
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read approve/reject taps
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python approve.py poll

      - name: Persist verdicts
        # always(), because approve.py records verdicts as it reads them and
        # advances the Telegram offset with them. getUpdates will not redeliver
        # those taps, so a failed run's verdicts still have to be committed.
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: record clip verdicts"
            git pull --rebase --autostash
            git push
          fi

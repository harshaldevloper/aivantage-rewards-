name: Campaign watcher

# Daily digest of AI-niche Content Rewards campaigns. Stdlib only, so no
# install step and each run costs a few seconds of the free Actions quota.
on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:
    inputs:
      new_only:
        description: "Stay silent unless a campaign is new"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py ${{ inputs.new_only && '--new-only' || '' }}

      - name: Remember which campaigns we have already reported
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update seen campaigns"
            git push
          fi
